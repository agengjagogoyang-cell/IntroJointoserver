name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cari folder yang ada pom.xml lalu build
        run: |
          POM_PATH=$(find . -name pom.xml | head -n 1)
          if [ -z "$POM_PATH" ]; then
            echo "::error::pom.xml TIDAK DITEMUKAN di repo!"
            exit 1
          fi
          cd "$(dirname "$POM_PATH")"
          mvn clean package

      - name: Upload file jar
        uses: actions/upload-artifact@v4
        with:
          name: IntroJoin
          path: '**/target/*.jar'
