name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build Maven
        run: |
          set -e
          POM=$(find . -name pom.xml | head -n 1)
          if [ -z "$POM" ]; then
            echo "::error::pom.xml TIDAK ADA DI REPO GITHUB!"
            exit 1
          fi
          cd "$(dirname "$POM")"
          mvn clean package -DskipTests

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: ZentraIntro
          path: '**/target/*.jar'
