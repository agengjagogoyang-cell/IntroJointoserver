name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Cek apakah pom.xml ada
        run: |
          if [ ! -f pom.xml ] && [ -z "$(find . -name pom.xml | head -n1)" ]; then
            echo "::error::pom.xml TIDAK DITEMUKAN! Pastikan kamu sudah upload pom.xml ke repo"
            exit 1
          fi

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build Maven
        run: |
          POM_PATH=$(find . -name pom.xml | head -n 1)
          cd "$(dirname "$POM_PATH")"
          mvn clean package

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: IntroJoin
          path: '**/target/*.jar'
