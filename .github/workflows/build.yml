name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Masuk folder IntroJoinServer & Build
        run: |
          cd IntroJoinServer
          mvn clean package

      - name: Upload file .jar
        uses: actions/upload-artifact@v4
        with:
          name: IntroJoin
          path: IntroJoinServer/target/*.jar
